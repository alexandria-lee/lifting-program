<style>
:root{
  /* Sunlit Coral — light, warm, modern. Token names kept; values now mean
     bg=warm white, surface=white, chalk=ink, steel/steelDim=stone, amber=coral. */
  --bg:#F7F5F2; --surface:#FFFFFF; --surface2:#F0EDE8; --line:#E8E3DC;
  --chalk:#26211D; --steel:#7A736B; --steelDim:#ABA398; --amber:#FF6B5E; --amberDim:rgba(255,107,94,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
input,button{font-family:inherit;}
html{height:100%;scroll-padding-top:calc(60px + env(safe-area-inset-top));}
body{min-height:100%;}
body{
  background:radial-gradient(120% 60% at 50% -10%, #FFFFFF 0%, var(--bg) 55%) no-repeat;
  background-attachment:fixed; color:var(--chalk);
  font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
.data{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.01em;}
.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--steel);font-weight:700;}
.colhead{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--steelDim);font-weight:700;}

header{
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 14px;
}
/* Slim sticky workout HUD — appears on scroll once the header stats scroll off. */
/* Fixed (not sticky) so toggling it on scroll never shifts page content. */
.hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;gap:12px;align-items:center;
  background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;}
.hud[hidden]{display:none;}
.row{display:flex;align-items:center;}
.between{justify-content:space-between;}
.step{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;color:var(--chalk);cursor:pointer;font-size:20px;box-shadow:0 1px 3px rgba(38,33,29,.05);}
.step:disabled{opacity:.3;}
.wk{font-size:26px;line-height:1;font-weight:800;letter-spacing:-.02em;}
.pills{display:flex;gap:7px;margin-top:16px;}
.pill{flex:1;padding:8px 5px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);color:var(--steel);text-align:center;line-height:1.1;cursor:pointer;box-shadow:0 1px 3px rgba(38,33,29,.05);}
.pill.active{background:var(--amber);color:#FFFFFF;border-color:var(--amber);box-shadow:0 4px 12px rgba(255,107,94,.30);}
.pill.done{border-color:var(--amber);}
.pill.done b{color:var(--amber);}
.pill.active.done b{color:#FFFFFF;}
.pill b{font-size:13px;font-weight:800;white-space:nowrap;}
.pill span{display:block;font-size:9.5px;margin-top:1px;font-weight:400;}
.railBg{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;}
.railFill{height:100%;border-radius:99px;background:var(--amber);transition:width .35s ease;}

.banner{display:flex;gap:8px;margin:12px 12px 0;padding:11px 13px;background:var(--amberDim);
  border:1px solid rgba(255,107,94,.25);border-radius:13px;font-size:12.5px;line-height:1.45;}
main{padding:0 12px 110px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;margin-top:12px;
  box-shadow:0 1px 3px rgba(38,33,29,.04),0 6px 20px rgba(38,33,29,.04);}
.card.main{border-left:3px solid var(--amber);}
.card h2{font-size:14.5px;font-weight:800;letter-spacing:-.02em;}
.card.main h2{font-size:17px;}
.hint{font-size:11px;color:var(--steelDim);margin-top:4px;font-style:italic;}
.last{font-size:11px;color:var(--amber);margin-top:2px;font-weight:700;}
.last.empty{color:var(--steelDim);}
.heads{display:flex;align-items:center;gap:8px;margin:12px 2px 2px;}
.setRow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:12px;transition:background .15s;}
.setRow.done{background:var(--amberDim);}
.setNo{width:26px;height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--steelDim);font-weight:700;}
.cell{height:34px;background:var(--surface2);border:1px solid var(--line);border-radius:11px;color:var(--chalk);
  font-family:inherit;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;
  text-align:center;outline:none;min-width:0;width:100%;}
.cell::placeholder{color:var(--steelDim);font-weight:500;}
.cell:focus{border-color:var(--amber);background:#FFF3F1;box-shadow:0 0 0 3px rgba(255,107,94,.12);}
.bwTag{flex:1;font-size:11px;color:var(--steelDim);font-style:italic;padding-left:2px;}
.check{width:38px;height:34px;flex:0 0 auto;border-radius:11px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;}
.check.done{background:var(--amber);border-color:var(--amber);box-shadow:0 3px 10px rgba(255,107,94,.30);}
.check svg{display:none;}
.check.done svg{display:block;}
.subnote{font-size:10.5px;color:var(--steelDim);margin-top:6px;padding-left:4px;}
.clear{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:18px;padding:10px;
  background:transparent;border:1px solid var(--line);border-radius:12px;color:var(--steel);font-size:12.5px;cursor:pointer;}
.foot{font-size:11.5px;line-height:1.5;color:var(--steelDim);margin-top:14px;padding:0 2px;}

/* session progress */
.doneCard{background:var(--amberDim);border:1px solid var(--amber);border-radius:16px;padding:14px;margin-top:14px;}
.nextBtn{margin-top:12px;width:100%;padding:13px;background:var(--amber);color:#FFFFFF;border:none;
  border-radius:13px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(255,107,94,.30);}
.allDone{margin-top:10px;font-size:12.5px;color:var(--amber);font-weight:700;}

/* backup / restore toolbar */
.tbtn{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:6px 10px;font-size:11.5px;font-weight:700;color:var(--steel);cursor:pointer;
  box-shadow:0 1px 3px rgba(38,33,29,.05);}
.tbtn .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 0 2px var(--bg);}
.tbtn .dot[hidden]{display:none;}

/* toast (import undo, etc.) */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;
  display:flex;gap:12px;align-items:center;max-width:340px;width:calc(100% - 32px);
  background:var(--chalk);color:#fff;border-radius:14px;padding:12px 14px;
  font-size:13px;line-height:1.3;box-shadow:0 8px 24px rgba(38,33,29,.28);}
.toast span{flex:1;}
.toast button{flex:0 0 auto;background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:9px;
  padding:7px 12px;font-weight:700;font-size:13px;cursor:pointer;}
.toast[hidden]{display:none;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<header>
  <div class="row between">
    <div class="row" style="gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6B5E" stroke-width="2" stroke-linecap="round"><line x1="6" y1="12" x2="18" y2="12"/><line x1="4.5" y1="8" x2="4.5" y2="16"/><line x1="8" y1="6.5" x2="8" y2="17.5"/><line x1="16" y1="6.5" x2="16" y2="17.5"/><line x1="19.5" y1="8" x2="19.5" y2="16"/></svg>
      <span class="eyebrow">8-Week Block</span>
    </div>
    <div class="row" style="gap:6px;">
      <button class="tbtn" id="exportBtn" title="Save a backup file of all your logs">Backup<span class="dot" id="exDot" hidden></span></button>
      <button class="tbtn" id="importBtn" title="Restore your logs from a backup file">Restore</button>
    </div>
  </div>

  <div class="row between" style="margin-top:12px;">
    <button class="step" id="wkPrev">‹</button>
    <div style="text-align:center;">
      <div class="data wk"><span id="wkNum">WEEK 1</span><span style="color:var(--steelDim);"> / 8</span></div>
      <div class="eyebrow" id="phase" style="margin-top:4px;">Reintroduction</div>
    </div>
    <button class="step" id="wkNext">›</button>
  </div>

  <div class="pills" id="pills"></div>

  <div class="row" id="headerStats" style="gap:12px;margin-top:16px;">
    <div style="flex:1;">
      <div class="row between" style="margin-bottom:6px;">
        <span class="eyebrow">Sets logged</span>
        <span class="data" style="font-size:12px;"><span id="doneCt">0</span><span style="color:var(--steelDim);">/<span id="totCt">0</span></span></span>
      </div>
      <div class="railBg"><div class="railFill" id="rail" style="width:0%;"></div></div>
    </div>
    <div style="text-align:right;padding-left:12px;border-left:1px solid var(--line);">
      <div class="eyebrow">Volume</div>
      <div class="data" style="font-size:14px;margin-top:2px;"><span id="vol">—</span><span style="font-size:10px;color:var(--steelDim);" id="volUnit"> kg</span></div>
    </div>
  </div>
</header>

<div id="hud" class="hud" hidden>
  <div style="flex:1;">
    <div class="row between" style="margin-bottom:5px;">
      <span class="eyebrow">Sets logged</span>
      <span class="data" style="font-size:12px;"><span id="hDone">0</span><span style="color:var(--steelDim);">/<span id="hTot">0</span></span></span>
    </div>
    <div class="railBg"><div class="railFill" id="hRail" style="width:0%;"></div></div>
  </div>
  <div style="text-align:right;padding-left:12px;border-left:1px solid var(--line);">
    <div class="eyebrow">Volume</div>
    <div class="data" style="font-size:14px;margin-top:2px;"><span id="hVol">—</span><span style="font-size:10px;color:var(--steelDim);"> kg</span></div>
  </div>
</div>

<div id="banner"></div>
<main id="main"></main>
<div id="toast" class="toast" hidden></div>

<script>
/* ───────── PROGRAM DATA ───────── */
const REPS={1:"5",2:"5",3:"4",4:"4",5:"4",6:"3",7:"3",8:"3"};
const RPE={1:"6",2:"7",3:"7",4:"8",5:"8",6:"8",7:"9",8:"6"};
const STD={1:4,2:4,3:4,4:5,5:4,6:3,7:3,8:3};
const DL={1:3,2:3,3:3,4:3,5:3,6:2,7:2,8:2};
const phaseOf=w=>w<=2?"Reintroduction":w<=5?"Accumulation":w<=7?"Intensification":"Deload / Retest";
/* Lower bound of a prescribed range, e.g. "6–8"→6, "8–10 / leg"→8, "5"→5. */
const lowOf=s=>parseInt(s,10);

/* Exercises performed with bodyweight only — no weight field shown. */
const BODYWEIGHT=new Set(["Hanging Leg Raise"]);

function mainScheme(week,type){
  if(type==="variation")
    return week===8?{count:3,reps:"6",rpe:"6",intensify:false}:{count:4,reps:"6–8",rpe:"7–8",intensify:false};
  const count=(type==="deadlift"?DL:STD)[week];
  return{count,reps:REPS[week],rpe:RPE[week],intensify:week===6||week===7};
}

const DAYS=[
 {short:"Squat",main:"Back Squat",type:"squat",acc:[
   ["Romanian Deadlift",3,"8–10"],["Bulgarian Split Squat",3,"8–10 / leg"],["Leg Press",3,"10–12"],
   ["Standing Calf Raise",4,"10–15"],["Hanging Leg Raise",3,"10–15"]]},
 {short:"Bench",main:"Bench Press",type:"standard",acc:[
   ["Overhead Press",3,"6–8"],["Incline DB Press",3,"8–12"],["Weighted Dip",3,"8–12"],
   ["Lateral Raise",3,"12–15"],["Triceps Pushdown",3,"10–15"]]},
 {short:"Deadlift",main:"Deadlift",type:"deadlift",acc:[
   ["Barbell Row",4,"6–10"],["Pull-Up / Lat Pulldown",3,"8–12"],["Face Pull",3,"15–20"],
   ["Barbell Curl",3,"10–12"],["Back Extension",3,"10–15"]]},
 {short:"Bench v.",main:"Bench Variation",type:"variation",hint:"Close-grip · Pause · Incline — pick one, keep it 8 wks",acc:[
   ["Incline DB Press",3,"10–12"],["Seated Cable Row",3,"10–12"],["Lat Pulldown",3,"10–12"],
   ["Lateral Raise",3,"12–15"],["Hammer Curl",3,"10–12"]]},
 {short:"Squat v.",main:"Squat Variation",type:"variation",hint:"Front · Pause · Tempo — pick one, keep it 8 wks",acc:[
   ["Romanian Deadlift",3,"8–10"],["Walking Lunge",3,"10–12 / leg"],["Leg Curl",3,"12–15"],
   ["Leg Extension",3,"12–15"],["Seated Calf Raise",4,"12–15"]]}
];

function buildSession(week,d){
  const day=DAYS[d],s=mainScheme(week,day.type);
  const mainRows=Array.from({length:s.count},(_,i)=>({reps:s.reps,rpe:s.rpe,
    label:s.intensify?(i===0?"Top set":"Back-off ~90%"):null}));
  const main={name:day.main,isMain:true,bodyweight:false,hint:day.hint,target:`${s.count} × ${s.reps} · RPE ${s.rpe}`,rows:mainRows};
  const accs=day.acc.map(([name,sets,range])=>({name,isMain:false,bodyweight:BODYWEIGHT.has(name),target:`${sets} × ${range}`,
    rows:Array.from({length:sets},()=>({reps:range,rpe:null,label:null}))}));
  return[main,...accs];
}

/* ───────── STATE + STORAGE ───────── */
const LK="ironlog-logs", PK="ironlog-pos", MK="ironlog-meta",
      PREVK="ironlog-logs-prev", EXK="ironlog-exhash";
let logs={}, week=1, day=0, saveT=null;

/* ───────── BACKUP / MIGRATION ─────────
   The backup file and on-device storage share ONE versioned data shape so the
   app can evolve without losing entries. See README "Evolving the data schema".

   Rule of thumb when iterating:
   • Adding an OPTIONAL field (e.g. notes): no schema bump — normRow() fills the
     default, so old data just gets the new field empty.
   • Renaming/removing a field, changing a key format, or re-meaning a value:
     bump CURRENT_SCHEMA by 1 and add a MIGRATIONS[n] step that upgrades n -> n+1.
   • Changing the unit (kg<->lb): keep it as APP_UNIT — import detects a mismatch
     against the file's app.unit and offers to convert, rather than silently
     relabelling numbers. */
const BACKUP_FORMAT="strength-trainer-backup";
const CURRENT_SCHEMA=1;
const APP_UNIT="kg";

/* Forward-only migrations. MIGRATIONS[v] takes the whole {logs,pos} blob at
   schema v and returns it at schema v+1. Pure functions; add one per breaking
   change. (Empty today — schema 1 is the current shape.) */
const MIGRATIONS={
  // 1:(d)=>{ /* example: d.logs = renameSomething(d.logs); */ return d; },
};
function migrate(data,from,to){
  for(let v=from;v<to;v++){if(MIGRATIONS[v])data=MIGRATIONS[v](data);}
  return data;
}
/* Coerce one stored set to the canonical shape, preserving any unknown keys so
   a newer field survives a round-trip through an older app. */
function normRow(r){return{weight:"",reps:"",rpe:"",done:false,...(r&&typeof r==="object"?r:{})};}
function normLogs(L){
  const out={};
  if(L&&typeof L==="object")for(const k in L){
    const d=L[k];if(!d||typeof d!=="object")continue;
    out[k]={};
    for(const ex in d)if(Array.isArray(d[ex]))out[k][ex]=d[ex].map(normRow);
  }
  return out;
}
function readJSON(k,fb){try{const v=JSON.parse(localStorage.getItem(k));return v==null?fb:v;}catch(e){return fb;}}

/* Load on-device data and migrate it forward to CURRENT_SCHEMA on every launch. */
(function loadAndMigrate(){
  const meta=readJSON(MK,null);
  const raw=readJSON(LK,{});
  const pos=readJSON(PK,{});
  const hasData=raw&&typeof raw==="object"&&Object.keys(raw).length>0;
  // No meta means pre-versioning data: treat existing data as schema 1, a fresh
  // install as already-current (nothing to migrate).
  const stored=(meta&&typeof meta.schema==="number")?meta.schema:(hasData?1:CURRENT_SCHEMA);
  let data={logs:raw,pos};
  if(stored<CURRENT_SCHEMA)data=migrate(data,stored,CURRENT_SCHEMA);
  logs=normLogs(data.logs||{});
  try{localStorage.setItem(MK,JSON.stringify({schema:CURRENT_SCHEMA,unit:APP_UNIT}));}catch(e){}
  if(stored<CURRENT_SCHEMA){try{localStorage.setItem(LK,JSON.stringify(logs));}catch(e){}}
})();

/* Build the export envelope. */
function buildBackup(){
  return{format:BACKUP_FORMAT,schema:CURRENT_SCHEMA,exportedAt:new Date().toISOString(),
    app:{unit:APP_UNIT},data:{logs:normLogs(logs),pos:readJSON(PK,{week,day})}};
}
/* Validate + migrate an imported envelope. Returns {ok,...} without touching
   live data — the caller decides whether to commit. */
function applyBackup(obj){
  if(!obj||obj.format!==BACKUP_FORMAT||typeof obj.schema!=="number"||!obj.data||typeof obj.data!=="object")
    return{ok:false,error:"This doesn't look like a Strength Trainer backup file."};
  if(obj.schema>CURRENT_SCHEMA)
    return{ok:false,error:"This backup was made by a newer version of the app. Update the app, then import again."};
  const fileUnit=(obj.app&&obj.app.unit)||APP_UNIT;
  let data={logs:obj.data.logs||{},pos:obj.data.pos||{}};
  if(obj.schema<CURRENT_SCHEMA)data=migrate(data,obj.schema,CURRENT_SCHEMA);
  return{ok:true,unitMismatch:fileUnit!==APP_UNIT,fileUnit,logs:normLogs(data.logs),pos:data.pos};
}
function convertUnits(L,from,to){
  const f=(from==="kg"&&to==="lb")?2.20462:(from==="lb"&&to==="kg")?0.453592:1;
  if(f===1)return L;
  const out={};
  for(const k in L){out[k]={};for(const ex in L[k])out[k][ex]=L[k][ex].map(r=>{
    const w=parseFloat(r.weight);
    return{...r,weight:isNaN(w)?r.weight:String(Math.round(w*f*2)/2)};});}
  return out;
}
function countSets(L){let n=0;for(const k in L)for(const ex in L[k])L[k][ex].forEach(r=>{if(r.weight!==""||r.done)n++;});return n;}

/* Replace live data with an imported set, snapshotting first so it can be undone. */
function commitImport(newLogs,newPos){
  try{localStorage.setItem(PREVK,localStorage.getItem(LK)||"{}");}catch(e){}
  logs=newLogs;
  try{localStorage.setItem(LK,JSON.stringify(logs));}catch(e){}
  try{localStorage.setItem(MK,JSON.stringify({schema:CURRENT_SCHEMA,unit:APP_UNIT}));}catch(e){}
  if(newPos&&typeof newPos.week==="number"){week=newPos.week;day=+newPos.day||0;savePos();}
  markExported();
}
function undoImport(){
  const p=localStorage.getItem(PREVK);if(p==null)return false;
  try{logs=normLogs(JSON.parse(p)||{});localStorage.setItem(LK,p);localStorage.removeItem(PREVK);}catch(e){return false;}
  return true;
}

/* "Backup recommended" nudge: dot shows when there are logged sets that differ
   from the last exported/imported snapshot. */
function logsHash(){const s=JSON.stringify(logs);let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return String(h);}
function markExported(){try{localStorage.setItem(EXK,logsHash());}catch(e){}refreshNudge();}
function needsBackup(){return Object.keys(logs).length>0 && localStorage.getItem(EXK)!==logsHash();}
function refreshNudge(){const d=$("exDot");if(d)d.hidden=!needsBackup();}

/* ───────── EXPORT / IMPORT (UI) ───────── */
async function doExport(){
  const json=JSON.stringify(buildBackup(),null,2);
  const fname=`strength-trainer-backup-${new Date().toISOString().slice(0,10)}.json`;
  // Native share sheet is the dependable path inside an iOS home-screen PWA.
  try{
    const file=new File([json],fname,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"Strength Trainer backup"});
      markExported();return;
    }
  }catch(e){if(e&&e.name==="AbortError")return;/* else fall back to download */}
  const url=URL.createObjectURL(new Blob([json],{type:"application/json"}));
  const a=document.createElement("a");a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  markExported();
}
function doImport(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let obj;try{obj=JSON.parse(rd.result);}catch(e){alert("Couldn't read that file — it isn't valid JSON.");return;}
      const res=applyBackup(obj);
      if(!res.ok){alert(res.error);return;}
      let toLoad=res.logs;
      if(res.unitMismatch){
        const convert=confirm(`This backup was saved in ${res.fileUnit}, but the app uses ${APP_UNIT}.\n\nOK — convert values (${res.fileUnit}→${APP_UNIT}).\nCancel — import the numbers unchanged.`);
        if(convert)toLoad=convertUnits(toLoad,res.fileUnit,APP_UNIT);
      }
      const n=countSets(toLoad);
      if(!confirm(`Restore this backup?\n\nIt has ${n} logged set${n===1?"":"s"} and will replace what's in the app now. You can undo straight after.`))return;
      commitImport(toLoad,res.pos);
      renderAll();window.scrollTo(0,0);
      toast(`Restored ${n} set${n===1?"":"s"}.`,"Undo",()=>{if(undoImport()){renderAll();toast("Import undone.");}});
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ───────── TOAST ───────── */
let toastT=null;
function toast(msg,actionLabel,onAction,ms=8000){
  const el=$("toast");el.innerHTML="";
  const span=document.createElement("span");span.textContent=msg;el.appendChild(span);
  if(actionLabel){const b=document.createElement("button");b.textContent=actionLabel;
    b.onclick=()=>{hideToast();onAction&&onAction();};el.appendChild(b);}
  el.hidden=false;clearTimeout(toastT);if(ms)toastT=setTimeout(hideToast,ms);
}
function hideToast(){$("toast").hidden=true;clearTimeout(toastT);}

const keyFor=(w,d)=>`w${w}d${d}`;
const keyOf=()=>keyFor(week,day);
function saveLogs(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LK,JSON.stringify(logs));}catch(e){}},400);}
function savePos(){try{localStorage.setItem(PK,JSON.stringify({week,day}));}catch(e){}}

function getRow(ex,i,w=week,d=day){const k=keyFor(w,d);const a=logs[k]&&logs[k][ex];return(a&&a[i])||{weight:"",reps:"",rpe:"",done:false};}
function setField(ex,i,f,v){
  const k=keyOf();
  if(!logs[k])logs[k]={};
  if(!logs[k][ex])logs[k][ex]=[];
  while(logs[k][ex].length<=i)logs[k][ex].push({weight:"",reps:"",rpe:"",done:false});
  logs[k][ex][i]={...logs[k][ex][i],[f]:v};
  saveLogs();
}
function lastWeekRef(ex){
  const a=logs[`w${week-1}d${day}`]&&logs[`w${week-1}d${day}`][ex];
  if(!a)return null;
  let best=null;
  a.forEach(s=>{const w=parseFloat(s.weight);if(!isNaN(w)&&(!best||w>parseFloat(best.weight)))best=s;});
  if(!best)return null;
  // Reps/RPE are no longer logged — show last week's prescription instead.
  const s=mainScheme(week-1,DAYS[day].type);
  return `${best.weight}kg × ${lowOf(s.reps)} @ ${lowOf(s.rpe)}`;
}

/* ───────── SESSION COMPLETION ───────── */
function sessionStatus(w,d){
  const session=buildSession(w,d);
  let total=0,done=0;
  session.forEach(ex=>ex.rows.forEach((_,i)=>{total++;if(getRow(ex.name,i,w,d).done)done++;}));
  return{total,done,complete:total>0&&done===total};
}
function findNextIncomplete(){
  for(let w=1;w<=8;w++)for(let d=0;d<DAYS.length;d++)
    if(!sessionStatus(w,d).complete)return{week:w,day:d};
  return{week:8,day:DAYS.length-1};
}

/* ───────── RENDER ───────── */
const $=id=>document.getElementById(id);
const CHECK='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const BIGCHECK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF6B5E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto;"><circle cx="12" cy="12" r="10"/><polyline points="16.5 9 11 14.5 8 11.5"/></svg>';

function renderPills(){
  $("pills").innerHTML=DAYS.map((d,i)=>{
    const done=sessionStatus(week,i).complete;
    return`<button class="pill${i===day?" active":""}${done?" done":""}" data-day="${i}"><b>${done?"✓ ":""}Day ${i+1}</b><span>${d.short}</span></button>`;
  }).join("");
}

function renderHeader(){
  $("wkNum").textContent="WEEK "+week;
  $("phase").textContent=phaseOf(week);
  $("phase").style.color=week===8?"var(--amber)":"var(--steel)";
  $("wkPrev").disabled=week===1; $("wkNext").disabled=week===8;
  $("volUnit").textContent=" kg";
  $("banner").innerHTML = week===8
    ? `<div class="banner"><svg width="13" height="13" viewBox="0 0 24 24" fill="#FF6B5E" style="flex:0 0 auto;margin-top:1px;"><path d="M12 2c1 4-2 5-2 8a3 3 0 006 0c0-1-.5-2-1-3 2 1 3 3 3 6a6 6 0 11-12 0c0-4 4-6 6-11z"/></svg><span>Deload week. Keep main lifts light &amp; fast (RPE 6) days 1–3. Later in the week, work up to a heavy single or triple to estimate your new max.</span></div>`
    : "";
}

function renderMain(){
  const session=buildSession(week,day);
  let html=`<div id="sessionBanner"></div>`;
  session.forEach((ex,ei)=>{
    const last=ex.isMain?lastWeekRef(ex.name):null;
    html+=`<section class="card${ex.isMain?" main":""}">
      <div class="row between" style="align-items:flex-start;gap:8px;">
        <div>
          <h2>${ex.name}</h2>
          <div class="eyebrow" style="margin-top:3px;">${ex.target}</div>
          ${ex.hint?`<div class="hint">${ex.hint}</div>`:""}
        </div>
        ${ex.isMain?`<div style="text-align:right;flex:0 0 auto;">
          <div class="eyebrow" style="color:var(--steelDim);">Last wk</div>
          <div class="last${last?"":" empty"}">${last||"—"}</div></div>`:""}
      </div>
      <div class="heads">
        <span style="width:26px;"></span>
        ${ex.bodyweight
          ? `<span class="colhead" style="flex:1;">Bodyweight</span>`
          : `<span class="colhead" style="flex:1;">Weight (kg)</span>`}
        <span style="width:38px;"></span>
      </div>`;
    ex.rows.forEach((row,i)=>{
      const r=getRow(ex.name,i);
      html+=`<div class="setRow${r.done?" done":""}" data-ex="${ei}" data-set="${i}">
        <div class="setNo data">${row.label==="Top set"?"T":i+1}</div>
        ${ex.bodyweight
          ? `<span class="bwTag">Bodyweight</span>`
          : `<div style="flex:1;"><input class="cell" inputmode="decimal" placeholder="–" data-f="weight" value="${r.weight}"></div>`}
        <button class="check${r.done?" done":""}" data-f="done">${CHECK}</button>
      </div>`;
    });
    if(ex.rows.some(row=>row.label==="Back-off ~90%"))
      html+=`<div class="subnote">Back-off sets ≈ 90% of your top-set weight</div>`;
    html+=`</section>`;
  });
  html+=`<button class="clear" id="clearBtn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg> Clear this day’s log</button>
  <p class="foot">Pick the weight that hits the target RPE. When you beat the rep target below that RPE, add a little next time. Tick every set to mark the session done — the app opens on your next session. Everything saves automatically on this device.</p>`;
  $("main").innerHTML=html;
  $("clearBtn").onclick=()=>{delete logs[keyOf()];saveLogs();renderMain();refreshStats();};
  window.__session=session;
}

function updateSessionBanner(tot,done){
  const el=$("sessionBanner");if(!el)return;
  if(tot>0&&done===tot){
    const nxt=findNextIncomplete();
    const more=!(nxt.week===week&&nxt.day===day);
    el.innerHTML=`<div class="doneCard">
      <div class="row" style="gap:10px;align-items:center;">${BIGCHECK}
        <div><div style="font-weight:700;font-size:15px;">Session complete</div>
        <div class="eyebrow" style="margin-top:3px;">Week ${week} · ${DAYS[day].short} — all sets logged</div></div></div>
      ${more
        ? `<button class="nextBtn" id="nextBtn">Next: Week ${nxt.week} · ${DAYS[nxt.day].short} →</button>`
        : `<div class="allDone">🎉 Program complete — every session done.</div>`}
    </div>`;
    const b=$("nextBtn");if(b)b.onclick=()=>{week=nxt.week;day=nxt.day;renderAll();window.scrollTo(0,0);};
  }else{
    el.innerHTML="";
  }
}

function refreshStats(){
  const session=window.__session||buildSession(week,day);
  let tot=0,done=0,vol=0;
  session.forEach(ex=>ex.rows.forEach((row,i)=>{
    tot++;const r=getRow(ex.name,i);
    if(r.done){
      done++;
      const w=parseFloat(r.weight),rp=lowOf(row.reps);
      if(!isNaN(w)&&!isNaN(rp))vol+=w*rp;
    }
  }));
  const pct=(tot?Math.round(done/tot*100):0)+"%", volTxt=vol?Math.round(vol).toLocaleString():"—";
  $("doneCt").textContent=done;$("totCt").textContent=tot;
  $("rail").style.width=pct;
  $("vol").textContent=volTxt;
  // Mirror into the slim sticky HUD.
  $("hDone").textContent=done;$("hTot").textContent=tot;
  $("hRail").style.width=pct;
  $("hVol").textContent=volTxt;
  renderPills();
  updateSessionBanner(tot,done);
  refreshNudge();
}

function renderAll(){renderHeader();renderMain();refreshStats();savePos();}

/* ───────── EVENTS ───────── */
$("exportBtn").onclick=doExport;
$("importBtn").onclick=doImport;
$("wkPrev").onclick=()=>{if(week>1){week--;renderAll();}};
$("wkNext").onclick=()=>{if(week<8){week++;renderAll();}};
$("pills").onclick=e=>{const b=e.target.closest(".pill");if(b){day=+b.dataset.day;renderAll();}};

// Show the slim HUD only once the header's own stats have scrolled out of view.
new IntersectionObserver(([e])=>{$("hud").hidden=e.isIntersecting;},{threshold:0})
  .observe($("headerStats"));

// input edits — update in place, no re-render (keeps keyboard focus)
$("main").addEventListener("input",e=>{
  const inp=e.target.closest(".cell");if(!inp)return;
  const rowEl=inp.closest(".setRow");
  const ex=window.__session[+rowEl.dataset.ex].name;
  setField(ex,+rowEl.dataset.set,inp.dataset.f,inp.value);
  refreshStats();
});
// done toggle
$("main").addEventListener("click",e=>{
  const btn=e.target.closest(".check");if(!btn)return;
  const rowEl=btn.closest(".setRow");
  const ex=window.__session[+rowEl.dataset.ex].name, i=+rowEl.dataset.set;
  const now=!getRow(ex,i).done;
  setField(ex,i,"done",now);
  rowEl.classList.toggle("done",now);btn.classList.toggle("done",now);
  refreshStats();
});

/* On open, jump to the next session that still needs doing. */
(()=>{const start=findNextIncomplete();week=start.week;day=start.day;})();
renderAll();

/* ───────── PWA SERVICE WORKER ───────── */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
